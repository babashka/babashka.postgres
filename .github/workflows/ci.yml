name: CI

on: [push, pull_request]

jobs:
  bb:
    name: babashka (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: ikalnytskyi/action-setup-postgres@v8
        id: postgres

      - name: Put libpq.dll on the PATH
        if: runner.os == 'Windows'
        run: echo "$PGBIN" >> "$GITHUB_PATH"

      - name: Install babashka dev build
        run: |
          bash <(curl -s https://raw.githubusercontent.com/babashka/babashka/master/install) --dev-build --dir . --dynamic

      - name: Run tests
        env:
          PG_TEST_CONNINFO: ${{ steps.postgres.outputs.connection-uri }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then bb=./bb.exe; else bb=./bb; fi
          "$bb" test:bb

  jvm:
    name: JVM (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: ikalnytskyi/action-setup-postgres@v8
        id: postgres

      - name: Put libpq.dll on the PATH
        if: runner.os == 'Windows'
        run: echo "$PGBIN" >> "$GITHUB_PATH"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      - name: Run tests
        env:
          PG_TEST_CONNINFO: ${{ steps.postgres.outputs.connection-uri }}
        run: clojure -M:test
